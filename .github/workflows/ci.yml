name: Package checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine pytest ruff
      - run: python -m ruff check .
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: python -m pytest -q
      - name: Verify installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c "import aspyp; from importlib.metadata import version; assert aspyp.__version__ == version('aspyp-dataset-engine')"
