[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aspyp-dataset-engine"
version = "0.1.0"
description = "Open-source evidence and graph infrastructure for blockchain intelligence and AI-agent transaction verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License to be determined" }
authors = [{ name = "ASPYP contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
